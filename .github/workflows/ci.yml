name: Synapse CI

on:
  push:
    branches: [ main ]
    tags: ['capabilities-v*']
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  test-nix:
    name: Test pinned Nix toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3.21.5
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', '**/*.nix', 'tests/souffle/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 2G
      - name: Check all Linux derivations
        run: nix flake check --no-update-lock-file
      - name: Run Souffle recursive typed smoke
        run: nix build --no-update-lock-file .#checks.x86_64-linux.souffle-recursive-typed-smoke

  test-capabilities:
    name: Test and build capability package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/capabilities
    steps:
      - uses: actions/checkout@v5
        with:
          # tests/test_cli_engine.py pins a pre-unification baseline commit and
          # SKIPS when it cannot resolve it. A shallow clone would turn that
          # baseline check into a silent skip -- the exact "omission reads as a
          # pass" failure the capability engine exists to refuse.
          fetch-depth: 0
      - name: Install pinned Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3.21.5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install build tooling
        run: python -m pip install uv
      - name: Test the standalone engine
        run: nix develop ../.. --no-update-lock-file --command bash -lc 'PYTHONPATH=src uv run --frozen python -m unittest discover -s tests -t .'
      - name: Verify capcov blocks false advancement
        timeout-minutes: 8
        run: uv run --frozen --with pytest sh scripts/check-backpressure.sh
      - name: Verify the real Go flow gates and its fault control is rejected
        timeout-minutes: 10
        run: uv run --frozen --extra treesitter sh scripts/check-real-go-flow.sh
      - name: Build distributions
        run: uv build
      - name: Verify wheel, entry points, and release version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          uv venv /tmp/capabilities-install
          uv pip install --python /tmp/capabilities-install/bin/python dist/*.whl
          nix develop ../.. --no-update-lock-file --command bash -lc '/tmp/capabilities-install/bin/python -m unittest discover -s tests -t .'
          /tmp/capabilities-install/bin/capcov --help
          /tmp/capabilities-install/bin/capcov flows --help
          /tmp/capabilities-install/bin/synapse-capabilities --help
          /tmp/capabilities-install/bin/python -c 'import importlib.metadata as m, os, capcov; version=m.version("synapse-capabilities"); assert capcov.__version__ == version; ref=os.environ["RELEASE_REF"]; assert not ref.startswith("refs/tags/") or ref == "refs/tags/capabilities-v" + version'
      - uses: actions/upload-artifact@v4
        with:
          name: capability-distributions
          path: packages/capabilities/dist/*
          if-no-files-found: error

  release-capabilities:
    name: Release capability package
    needs: test-capabilities
    if: startsWith(github.ref, 'refs/tags/capabilities-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: capability-distributions
          path: dist
      - name: Publish tested Python distributions
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  test-cli:
    name: Test CLI Package
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22, 24]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: packages/cli
        run: npm ci

      - name: Check TypeScript types
        working-directory: packages/cli
        run: npm run check:types

      - name: Build CLI
        working-directory: packages/cli
        run: npm run build

      - name: Run unit tests
        working-directory: packages/cli
        run: npm test

      - name: Link CLI globally (Unix)
        if: runner.os != 'Windows'
        working-directory: packages/cli
        run: npm link

      - name: Link CLI globally (Windows)
        if: runner.os == 'Windows'
        working-directory: packages/cli
        run: npm link
        shell: cmd

      - name: Test CLI help command
        run: synapse --help

  test-context-mcp:
    name: Test context MCP package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:types -w packages/context-mcp
      - run: npm run build -w packages/context-mcp
      - run: npm test -w packages/context-mcp

  validate-docs:
    name: Validate Documentation
    needs: test-cli
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: packages/cli
        run: npm ci

      - name: Build CLI
        working-directory: packages/cli
        run: npm run build

      - name: Link CLI globally
        working-directory: packages/cli
        run: npm link

      - name: Validate content with strict mode
        id: validate
        run: |
          # Run validation with JSON format, specifying the content directory
          # Use || true to continue even if validation finds errors
          synapse validate --dir content --strict --format json > validation-results.json 2>&1 || VALIDATION_EXIT_CODE=$?

          # Debug: Show what was captured
          echo "=== Validation exit code: ${VALIDATION_EXIT_CODE:-0} ==="
          echo "=== First 1000 chars of validation-results.json ==="
          head -c 1000 validation-results.json || echo "No output file"
          echo ""

          # Parse JSON results
          if [ -f validation-results.json ] && [ -s validation-results.json ]; then
            # Check if it's valid JSON first
            if jq -e . validation-results.json > /dev/null 2>&1; then
              errors=$(jq '.errors | length' validation-results.json)
              warnings=$(jq '.warnings | length' validation-results.json)
              total=$(jq '.summary.total' validation-results.json)
              valid=$(jq '.summary.valid' validation-results.json)

              echo "errors=$errors" >> $GITHUB_OUTPUT
              echo "warnings=$warnings" >> $GITHUB_OUTPUT

              echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
              echo "### Summary" >> $GITHUB_STEP_SUMMARY
              echo "- Total Documents: $total" >> $GITHUB_STEP_SUMMARY
              echo "- Valid: $valid" >> $GITHUB_STEP_SUMMARY
              echo "- Errors: $errors" >> $GITHUB_STEP_SUMMARY
              echo "- Warnings: $warnings" >> $GITHUB_STEP_SUMMARY

              if [ "$errors" -gt 0 ]; then
                echo "### ❌ Errors" >> $GITHUB_STEP_SUMMARY
                echo '```json' >> $GITHUB_STEP_SUMMARY
                jq '.errors[:10]' validation-results.json >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                # Don't exit yet - let's see all the errors first
                # exit 1
              fi

              if [ "$warnings" -gt 0 ]; then
                echo "### ⚠️ Warnings" >> $GITHUB_STEP_SUMMARY
                echo '```json' >> $GITHUB_STEP_SUMMARY
                jq '.warnings[:5]' validation-results.json >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
              fi

              if [ "$errors" -eq 0 ]; then
                echo "✅ Validation passed" >> $GITHUB_STEP_SUMMARY
              else
                echo "❌ Validation failed with $errors errors" >> $GITHUB_STEP_SUMMARY
                exit 1
              fi
            else
              echo "❌ Invalid JSON output from validation" >> $GITHUB_STEP_SUMMARY
              echo "Output was:" >> $GITHUB_STEP_SUMMARY
              cat validation-results.json >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          else
            echo "❌ Failed to generate validation results or empty file"
            exit 1
          fi

  publish:
    name: Publish to NPM
    needs: [test-cli, test-context-mcp, validate-docs]
    # Also runs on workflow_dispatch so a release can be kicked off by hand.
    # Pushes to main have not been reliably triggering this workflow (0.7.2
    # merged to main and produced no run at all), which left a merged version
    # bump unpublishable. The publish step is still idempotent — it compares the
    # local version against the registry and skips when they match — so a manual
    # run on an already-published version is a no-op rather than a failure.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Ensure npm supports trusted publishing
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          npm install -g npm@latest
          echo "npm (updated): $(npm --version)"

      - name: Check if version already published
        id: check
        run: |
          LOCAL_VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "version=$LOCAL_VERSION" >> $GITHUB_OUTPUT

          PUBLISHED=$(npm view @millstone/synapse-cli version 2>/dev/null || echo "none")
          echo "published=$PUBLISHED" >> $GITHUB_OUTPUT

          if [ "$LOCAL_VERSION" = "$PUBLISHED" ]; then
            echo "needs_publish=false" >> $GITHUB_OUTPUT
            echo "Version $LOCAL_VERSION already published — skipping"
          else
            echo "needs_publish=true" >> $GITHUB_OUTPUT
            echo "Will publish $LOCAL_VERSION (npm has $PUBLISHED)"
          fi

      - name: Install dependencies
        if: steps.check.outputs.needs_publish == 'true'
        run: |
          npm ci -w packages/schemas -w packages/cli -w packages/context-mcp -w packages/site --ignore-scripts

      - name: Build packages for publishing
        if: steps.check.outputs.needs_publish == 'true'
        run: |
          npm run build -w packages/cli
          npm run build -w packages/context-mcp

      - name: Publish @millstone/synapse-schemas
        if: steps.check.outputs.needs_publish == 'true'
        working-directory: packages/schemas
        run: npm publish --provenance --access public

      - name: Publish @millstone/synapse-cli
        if: steps.check.outputs.needs_publish == 'true'
        working-directory: packages/cli
        run: npm publish --provenance --access public

      - name: Publish @millstone/synapse-context-mcp
        if: steps.check.outputs.needs_publish == 'true'
        working-directory: packages/context-mcp
        run: npm publish --provenance --access public

      - name: Publish @millstone/synapse-site
        if: steps.check.outputs.needs_publish == 'true'
        working-directory: packages/site
        run: npm publish --provenance --access public

      - name: Tag release
        if: steps.check.outputs.needs_publish == 'true'
        run: |
          VERSION=${{ steps.check.outputs.version }}
          git tag -f "v$VERSION"
          git push origin "v$VERSION" --force

      - name: Create GitHub Release
        if: steps.check.outputs.needs_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check.outputs.version }}
          generate_release_notes: true

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [test-cli, validate-docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci -w packages/schemas -w packages/cli -w packages/site --ignore-scripts

      - name: Build CLI (needed by site build)
        run: npm run build -w packages/cli

      - name: Setup Quartz submodule
        working-directory: packages/site
        run: npx tsx setup-quartz.ts

      - name: Test example publication boundary
        run: npm test -w packages/site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          SYNAPSE_EXAMPLES_ONLY: 'true'
          QUARTZ_BASE_URL: ${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build -w packages/site

      - name: Verify example-only publication
        working-directory: packages/site
        run: npx tsx verify-examples.ts

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/quartz/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
